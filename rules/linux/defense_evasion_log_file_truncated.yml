id: "52a8d0fa-d2b2-5578-9cca-34b0e6156c6b_1"
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies truncate, shred or a redirect emptying files under /var/log.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
    - "auditbeat-*"
    - "logs-auditd_manager.auditd-*"
  language: eql
  license: Elastic License v2
  name: System Log File Truncated
  note: |
    ## Triage and analysis

    ### Investigating System Log File Truncated

    ### Possible investigation steps

    - Recover the logs from your log pipeline.
    - Review the session that ran the command.

    ### False positive analysis

    - Log rotation is handled by logrotate, which is not matched. Confirm other cases with the owner.
  query: |
    process where host.os.type == "linux" and event.type == "start" and
      event.action in ("exec", "exec_event", "start", "executed", "process_started") and
      (
        (process.name in ("truncate", "shred") and process.args like "/var/log/*") or
        (process.name in ("bash", "sh", "dash", "zsh") and process.command_line like~ ("*> /var/log/*", "*>/var/log/*"))
      )
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
    - package: auditd_manager
      version: ">=1.18.0"
  risk_score: 47
  rule_id: "52a8d0fa-d2b2-5578-9cca-34b0e6156c6b"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: medium
  tags:
    - "Domain: Endpoint"
    - "OS: Linux"
    - "Use Case: Threat Detection"
    - "Tactic: Defense Evasion"
    - "Data Source: Elastic Defend"
    - "Data Source: Auditd Manager"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
      technique:
        - id: T1070
          name: Indicator Removal
          reference: "https://attack.mitre.org/techniques/T1070/"
          subtechnique:
            - id: T1070.002
              name: Clear Linux or Mac System Logs
              reference: "https://attack.mitre.org/techniques/T1070/002/"
  timestamp_override: event.ingested
  type: eql
  version: 1
