id: b25c8743-000a-5726-8174-a076bce28a94_1
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies chattr setting the immutable attribute on a file in a system or configuration folder. Attackers do this so their changes cannot be undone easily.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
    - "auditbeat-*"
    - "logs-auditd_manager.auditd-*"
  language: eql
  license: Elastic License v2
  name: Immutable Attribute Set on a System File
  note: |
    ## Triage and analysis

    ### Investigating Immutable Attribute Set on a System File

    ### Possible investigation steps

    - List immutable files with `lsattr` and review them.
    - Remove the attribute and restore the files if needed.

    ### False positive analysis

    - Hardening scripts lock some files. Confirm with the owner.
  query: |
    process where host.os.type == "linux" and event.type == "start" and
      event.action in ("exec", "exec_event", "start", "executed", "process_started") and
      process.name == "chattr" and process.args like "+i*" and
      process.args like ("/etc/*", "/root/*", "/home/*/.ssh/*", "/usr/bin/*", "/bin/*")
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
    - package: auditd_manager
      version: ">=1.18.0"
  risk_score: 47
  rule_id: b25c8743-000a-5726-8174-a076bce28a94
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: medium
  tags:
    - "Domain: Endpoint"
    - "OS: Linux"
    - "Use Case: Threat Detection"
    - "Tactic: Defense Evasion"
    - "Data Source: Elastic Defend"
    - "Data Source: Auditd Manager"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
      technique:
        - id: T1222
          name: File and Directory Permissions Modification
          reference: "https://attack.mitre.org/techniques/T1222/"
          subtechnique:
            - id: T1222.002
              name: Linux and Mac File and Directory Permissions Modification
              reference: "https://attack.mitre.org/techniques/T1222/002/"
  timestamp_override: event.ingested
  type: eql
  version: 1
