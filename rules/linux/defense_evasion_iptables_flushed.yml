id: "9fff29ac-b696-5451-8bbf-68a22e4ac66b_1"
type: security-rule
attributes:
  author:
    - Elastic Community
  description: Identifies iptables or nftables flushing all rules, which removes host firewall protection.
  from: now-9m
  index:
    - "logs-endpoint.events.process*"
    - "auditbeat-*"
    - "logs-auditd_manager.auditd-*"
  language: eql
  license: Elastic License v2
  name: Firewall Rules Flushed via Iptables
  note: |
    ## Triage and analysis

    ### Investigating Firewall Rules Flushed via Iptables

    ### Possible investigation steps

    - Restore the firewall rules.
    - Check for new listening services or inbound connections.

    ### False positive analysis

    - Firewall management tools flush before reloading. Exclude them by `process.parent.executable`.
  query: |
    process where host.os.type == "linux" and event.type == "start" and
      event.action in ("exec", "exec_event", "start", "executed", "process_started") and
      (
        (process.name in ("iptables", "ip6tables", "iptables-legacy", "iptables-nft") and process.args in ("-F", "--flush")) or
        (process.name == "nft" and process.args == "flush" and process.args == "ruleset")
      )
  related_integrations:
    - package: endpoint
      version: ">=8.2.0"
    - package: auditd_manager
      version: ">=1.18.0"
  risk_score: 47
  rule_id: "9fff29ac-b696-5451-8bbf-68a22e4ac66b"
  setup: |
    ## Setup

    This rule requires data coming in from Elastic Defend.

    ### Elastic Defend Integration Setup
    Elastic Defend is integrated into the Elastic Agent using Fleet. Upon configuration, the integration allows the Elastic Agent to monitor events on your host and send data to the Elastic Security app.
  severity: medium
  tags:
    - "Domain: Endpoint"
    - "OS: Linux"
    - "Use Case: Threat Detection"
    - "Tactic: Defense Evasion"
    - "Data Source: Elastic Defend"
    - "Data Source: Auditd Manager"
    - "Resources: Investigation Guide"
    - "Source: Community"
  threat:
    - framework: MITRE ATT&CK
      tactic:
        id: TA0005
        name: Defense Evasion
        reference: "https://attack.mitre.org/tactics/TA0005/"
      technique:
        - id: T1562
          name: Impair Defenses
          reference: "https://attack.mitre.org/techniques/T1562/"
          subtechnique:
            - id: T1562.004
              name: Disable or Modify System Firewall
              reference: "https://attack.mitre.org/techniques/T1562/004/"
  timestamp_override: event.ingested
  type: eql
  version: 1
